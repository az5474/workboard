# src/ 폴더만 GitHub Pages 로 올린다.
#
# 저장소 뿌리에는 README·serve.ps1·db/ 가 함께 있어서 그대로 올리면
# 스키마 SQL 과 로컬 서버 스크립트까지 웹에 노출된다. 앱만 골라 올린다.
#
# 처음 한 번은 저장소 Settings > Pages 에서 Source 를 "GitHub Actions" 로 바꿔야 한다.
# (기본값인 "Deploy from a branch" 로 두면 이 워크플로가 돌아도 반영되지 않는다.)

name: Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:      # Actions 탭에서 손으로도 돌릴 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 밀어 넣어도 마지막 것만 배포되게 한다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./src

      - id: deployment
        uses: actions/deploy-pages@v4
